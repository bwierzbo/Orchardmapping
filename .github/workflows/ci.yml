name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build
        env:
          # Build-time placeholders; pages are dynamic and hit the DB at request time.
          POSTGRES_URL: postgres://user:pass@localhost:5432/placeholder
          AUTH_SECRET: ci-placeholder-secret-not-used-in-prod
